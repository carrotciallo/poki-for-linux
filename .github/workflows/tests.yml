name: Tests

on:
  push:
    branches: [linux-port]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y usbmuxd libplist-utils zip unzip zenity ffmpeg \
            tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim tesseract-ocr-jpn

      # The full setup is the CI build: host prerequisites, the pinned
      # idevice checkout and its tools, npm dependencies, and the native
      # bridge with the Rust OCR recognizer.
      - name: Build
        run: ./bin/setup

      - name: Install Poki Agent dependencies
        run: npm ci --prefix agent

      # The suite is specified per file: each test file runs in its own
      # process, matching how the port is verified locally. A failure is
      # also surfaced as a workflow annotation naming the file and the
      # failing tests, so the result is readable without the raw log.
      - name: Run each test file on its own
        run: |
          for file in test/*.test.mjs; do
            echo "=== $file"
            log="/tmp/$(basename "$file").log"
            if ! node --test "$file" >"$log" 2>&1; then
              cat "$log"
              echo "::error title=Failing test file::$file"
              grep -E '^✖ ' "$log" | head -10 | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g' -e 's/:/%3A/g' -e 's/,/%2C/g' | while IFS= read -r line; do
                echo "::error title=Failing test::$line"
              done
              exit 1
            fi
            grep -E '^ℹ (tests|pass|fail)' "$log"
          done
